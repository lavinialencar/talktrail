<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escolher a pasta do Talktrail</title>
<style>
  :root { --fundo: #f5f5f7; --texto: #09090b; --mudo: #52525b; --acento: #0f766e; --acento-t: #fff; --card: #fff; --linha: #d4d4dc; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #131313; --texto: #fafafa; --mudo: #a3a3a3; --acento: #2dd4bf; --acento-t: #04201d; --card: #1f1f1f; --linha: #3b3b3b; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--fundo); color: var(--texto); font: 15px/1.5 Inter, -apple-system, system-ui, sans-serif; display: grid; place-items: center; }
  main { width: min(460px, calc(100% - 40px)); background: var(--card); border: 1px solid var(--linha); border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.2; letter-spacing: -.01em; display: flex; align-items: center; gap: 14px; }
  h1 img { width: 48px; height: 48px; flex: none; }
  .sub { margin: 0 0 24px; color: var(--mudo); }
  ol { list-style: none; counter-reset: passo; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  li { counter-increment: passo; display: flex; align-items: flex-start; gap: 14px; }
  li::before { content: counter(passo); flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--acento); color: var(--acento-t); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  li span { padding-top: 3px; color: var(--mudo); }
  li b { color: var(--texto); font-weight: 700; }
  button { font: inherit; font-weight: 700; width: 100%; padding: 13px; border-radius: 10px; border: 0; cursor: pointer; background: var(--acento); color: var(--acento-t); }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
  #status { margin: 14px 0 0; color: var(--texto); font-weight: 600; }
  #status:empty { display: none; }
</style>
<body>
  <main>
    <h1><img src="icons/icon-128.png" alt="">Onde salvar suas reuniões?</h1>
    <p class="sub">O Talktrail grava o texto de cada reunião numa pasta sua, ao vivo.</p>
    <ol>
      <li><span>Clique em <b>Escolher uma pasta</b>. A janela abre em Documentos.</span></li>
      <li><span>Crie uma pasta chamada <b>Talktrail</b> (botão "Nova pasta").</span></li>
      <li><span>Clique em <b>Abrir</b>.</span></li>
    </ol>
    <button id="escolher" type="button">Escolher uma pasta…</button>
    <p id="status" role="status"></p>
  </main>
  <script src="pagina.js"></script>
  <script src="pasta.js"></script>
  <script src="escolher-pasta.js"></script>
</body>
</html>
